name: Pi compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        npm: ["11.0.0", "12.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
      - name: Install raw-rg integration prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version
      - name: Select npm output contract
        run: |
          npm install --global npm@${{ matrix.npm }}
          node --version
          npm --version
      - name: Install locked development dependencies
        run: npm ci
      - name: Warm Go mapper build cache
        # Cold standard-library compilation exceeds the packaged mapper's test budget.
        # Keep the warm-up binary outside the repo; tests still compile the packaged source.
        run: |
          go version
          warmup_binary="$RUNNER_TEMP/go-outline-cache-warmup"
          trap 'rm -f -- "$warmup_binary"' EXIT
          go build -o "$warmup_binary" ./scripts/go_outline.go
      - name: Verify locked host and full suite
        run: |
          npm test
          npm run typecheck
      - name: Install independent current host
        # Pi's internal dependencies use caret ranges; pin the complete Pi graph too.
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-0.99.1" --no-save --package-lock=false --no-audit --no-fund \
            @earendil-works/pi-coding-agent@0.99.1 \
            @earendil-works/pi-agent-core@0.99.1 \
            @earendil-works/pi-ai@0.99.1 \
            @earendil-works/pi-tui@0.99.1 \
            @earendil-works/pi-mcp@0.99.1 \
            @earendil-works/pi-codemode@0.99.1 \
            @earendil-works/pi-telemetry@0.99.1 \
            @earendil-works/chord@0.99.1
      - name: Verify real current-host pipeline
        env:
          PI_COMPAT_HOST: ${{ runner.temp }}/pi-0.99.1/node_modules/@earendil-works/pi-coding-agent
          PI_COMPAT_REQUIRE_NU: "1"
        run: npm test -- tests/pi-host-null-pipeline.test.ts
      - name: Remove independently provisioned host
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/pi-0.99.1"
