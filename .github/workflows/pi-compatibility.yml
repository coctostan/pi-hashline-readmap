name: Pi compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        npm: ["11.0.0", "12.1.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/bench-locate-tasks.test.ts extracts a pinned commit with git archive.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
      - name: Install raw-rg integration prerequisite
        # From ripgrep's GitHub release, not apt: Ubuntu's mirrors stopped resolving on 2026-11-11.
        env:
          RG_VERSION: "15.1.0"
          RG_SHA256: "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599"
        run: |
          archive="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$archive"
          echo "$RG_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${archive%.tar.gz}/rg" /usr/local/bin/rg
          rg --version
      - name: Select npm output contract
        run: |
          npm install --global npm@${{ matrix.npm }}
          node --version
          npm --version
      - name: Install locked development dependencies
        run: npm ci
      - name: Warm Go mapper build cache
        # Cold standard-library compilation exceeds the packaged mapper's test budget.
        # Keep the warm-up binary outside the repo; tests still compile the packaged source.
        run: |
          go version
          warmup_binary="$RUNNER_TEMP/go-outline-cache-warmup"
          trap 'rm -f -- "$warmup_binary"' EXIT
          go build -o "$warmup_binary" ./scripts/go_outline.go
      - name: Verify locked host and full suite
        env:
          PI_COMPAT_REQUIRE_NU: "1"
        run: |
          npm test
          npm run typecheck
